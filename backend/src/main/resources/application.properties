spring.application.name=saas-platform
server.port=8081
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [tenantId:%X{tenantId:-system}] - %msg%n

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-me-before-deployment}

master.datasource.url=${MASTER_DB_URL:jdbc:mysql://localhost:3306/master_db}
master.datasource.username=${MASTER_DB_USER:root}
master.datasource.password=${MASTER_DB_PASSWORD:root}
